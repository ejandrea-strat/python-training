services:
  jupyter: # core
    build: .
    image: python-training:3.0
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    volumes:
      - ./work:/workspace/work
      - ./data:/workspace/data
    env_file: .env

  sandbox-site:
    image: nginx:1.28-alpine
    profiles: ["scrape"]
    volumes:
      - "./sandbox_site:/usr/share/nginx/html:ro"
    ports:
      - "8080:80"